name: Test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-22.04
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test with coverage
        run: go test -timeout=40m -count=1 -coverprofile=coverage.txt ./...
      - name: Upload coverage
        if: env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          disable_search: true
  race-unit-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test with race detector
        run: go test -timeout=40m -count=1 -race ./...
  memfs-unit-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test with in-memory storage
        run: go test -timeout=40m -count=1 -tags=dragonboat_memfs_test ./...
  macos-unit-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test on macOS
        run: go test -timeout=40m -count=1 ./...
  build-tools:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build tools
        run: go build ./tools/...
  build-examples:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run single-node example
        run: go run ./examples/single-node
  static-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Static check
        run: |
          make install-static-check-tools
          make static-check
