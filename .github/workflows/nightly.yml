name: Nightly
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monkey-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [race-monkey-test, race-ondisk-monkey-test, memfs-monkey-test, memfs-ondisk-monkey-test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check out Drummer
        uses: actions/checkout@v6
        with:
          repository: lni/drummer
          ref: c8eabd881e943f9824683c21bbdccdd66d1f4abe
          path: drummer
          persist-credentials: false
      - name: Prepare Drummer for Stormoar and Go 1.27
        working-directory: drummer
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/use-local-stormoar.sh" "$GITHUB_WORKSPACE"
          perl -pi -e 's/\.Errorf\(err\.Error\(\)\)/.Errorf("%s", err.Error())/g' drummer.go election.go scheduler_test.go
          perl -pi -e 's/status\.Errorf\(code, err\.Error\(\)\)/status.Errorf(code, "%s", err.Error())/g' nodehostapi.go
      - name: Test Drummer
        working-directory: drummer
        run: make test
      - name: Run monkey test against Stormoar
        working-directory: drummer
        env:
          TARGET: ${{ matrix.target }}
          # Drummer's runtest target does not pass its RACE variable to go test.
          GOFLAGS: ${{ startsWith(matrix.target, 'race-') && '-race' || '' }}
        run: make "$TARGET"
