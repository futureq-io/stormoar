name: Nightly
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    name: Stress tests (${{ matrix.mode }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: race
            flags: -race -tags=dragonboat_monkeytest
          - mode: memfs
            flags: -tags=dragonboat_monkeytest,dragonboat_memfs_test
    env:
      SLOW_TEST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run Stormoar tests with stress checks
        run: go test -timeout=20m -count=1 ${{ matrix.flags }} ./...
